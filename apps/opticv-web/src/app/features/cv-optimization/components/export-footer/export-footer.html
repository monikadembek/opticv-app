<div class="export-footer" [class.collapsed]="!sidebarExpanded()">
  <div class="export-actions">
    <p-button
      label="Preview"
      icon="pi pi-eye"
      severity="secondary"
      [outlined]="true"
      size="small"
      class="preview-button"
      (onClick)="previewVisible.set(true)"
    />
    <p-button
      label="Export CV"
      icon="pi pi-cog"
      size="small"
      class="export-button"
      (onClick)="exportDialogVisible.set(true)"
      ariaLabel="Export CV"
    />
  </div>
</div>

<p-dialog
  header="CV Preview"
  [visible]="previewVisible()"
  (visibleChange)="$event ? null : previewVisible.set(false)"
  [modal]="true"
  [style]="{ width: '900px', maxWidth: '95vw' }"
  [contentStyle]="{ padding: '0', overflow: 'auto', height: '90vh' }"
  [draggable]="false"
>
  <app-cv-a4-preview
    [cv]="mergedCv()"
    [templateId]="selectedTemplate()"
    [accentColor]="accentColor()"
  />
</p-dialog>

<app-cv-export-dialog
  [visible]="exportDialogVisible()"
  (visibleChange)="exportDialogVisible.set($event)"
  [selectedTemplate]="selectedTemplate()"
  (selectedTemplateChange)="selectedTemplate.set($event)"
  [accentColor]="accentColor()"
  (accentColorChange)="accentColor.set($event)"
  [includeGdprClause]="includeGdprClause()"
  (includeGdprClauseChange)="includeGdprClause.set($event)"
  [showCompliance]="true"
  [allowedTemplateIds]="allowedTemplateIds()"
  [isExportingPdf]="isExportingPdf()"
  [isExportingDocx]="isExportingDocx()"
  (exportPdf)="exportPdf.emit()"
  (exportDocx)="exportDocx.emit()"
/>
