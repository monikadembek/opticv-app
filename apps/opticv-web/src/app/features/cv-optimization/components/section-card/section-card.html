<div
  [id]="'section-' + sectionId()"
  [attr.data-section]="sectionId()"
  class="section-card"
>
  <div class="section-card__header">
    <div class="section-card__icon"><i [class]="'pi ' + icon()"></i></div>
    <h2 class="section-card__title">{{ title() }}</h2>
    @if (status() === 'completed') {
    <span class="status-completed">
      <i class="pi pi-check-circle"></i>Completed
    </span>
    } @if (status() === 'processing') {
    <span class="status-processing">
      <i class="pi pi-spin pi-spinner"></i>Processing
    </span>
    } @if (status() === 'error') {
    <span class="status-error"> <i class="pi pi-times-circle"></i>Error </span>
    }
    <button
      type="button"
      class="section-card__toggle"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="(collapsed() ? 'Expand ' : 'Collapse ') + title() + ' section'"
      [title]="(collapsed() ? 'Expand ' : 'Collapse ') + 'section'"
      (click)="toggleCollapsed()"
    >
      <i
        class="pi"
        [class.pi-chevron-down]="collapsed()"
        [class.pi-chevron-up]="!collapsed()"
      ></i>
    </button>
  </div>
  <div
    class="section-card__body"
    [style.display]="collapsed() ? 'none' : null"
    [attr.hidden]="collapsed() ? '' : null"
  >
    @if (status() === 'processing') {
    <app-processing-placeholder />
    } @else if (status() !== 'pending') {
    <ng-content />
    }
  </div>
</div>
