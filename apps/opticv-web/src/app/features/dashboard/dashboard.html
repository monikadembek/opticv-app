<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-6">Dashboard</h1>

  <div class="flex gap-4 mb-8">
    <div
      class="flex-1 flex items-center gap-3 rounded-lg border border-(--border-subtle) p-4"
    >
      <span
        class="bg-(--primary-50) text-(--primary-700) text-xl rounded-sm p-3"
      >
        <i class="pi pi-file font-medium! text-xl!"></i>
      </span>

      <div class="flex flex-col">
        <span class="font-bold text-xl font-(family-name:--font-heading)"
          >{{ cvStore.cvList().length }}</span
        >
        <span class="text-sm text-surface-400">CV's stored</span>
      </div>
    </div>

    <div
      class="flex-1 flex items-center gap-3 rounded-lg border border-(--border-subtle) p-4"
    >
      <i
        class="pi pi-bolt rounded-sm bg-(--primary-50) text-(--primary-700) text-xl! font-medium! p-4"
      ></i>
      <div class="flex flex-col">
        <span class="font-bold text-xl font-(family-name:--font-heading)"
          >{{ optimizationsItems().length }}</span
        >
        <span class="text-sm">Optimizations</span>
      </div>
    </div>

    <div
      class="flex-1 flex items-center gap-3 rounded-lg border border-(--border-subtle) p-4"
    >
      <i
        class="pi pi-clock rounded-sm bg-(--primary-50) text-(--primary-700) text-xl! font-medium! px-3 py-4"
      ></i>
      <div class="flex flex-col">
        @if(lastActivityTime()) {
        <span class="font-bold text-xl font-(family-name:--font-heading)"
          >{{ lastActivityTime() | date: 'd MMM y' }}</span
        >
        } @else {
        <span class="font-bold text-xl font-(family-name:--font-heading)"
          >n/a</span
        >
        }

        <span class="text-sm">Latest activity</span>
      </div>
    </div>
  </div>

  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0">My CVs</p-tab>
      <p-tab value="1">My Optimizations</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0">
        <app-cv-file-list
          [cvFiles]="cvFiles()"
          [isCvsLoading]="isCvsLoading()"
          [cvsError]="cvsError()"
          (downloadCvFile)="downloadCv($event)"
          (deleteCvFile)="deleteCv($event)"
          (loadCvs)="loadUserCvs()"
        />
      </p-tabpanel>
      <p-tabpanel value="1">
        <app-optimization-list
          [items]="optimizationsItems()"
          [isLoading]="isLoadingOptimizations()"
          [error]="optimizationsError()"
          (retryLoadingOptimizations)="loadOptimizations()"
          (deleteOptimizations)="onDeleteOptimizations($event)"
        />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>

<p-confirmDialog [style]="{ width: '600px', maxWidth: '95vw' }" />
