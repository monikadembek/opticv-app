<div
  class="flex items-center justify-between gap-4 p-4 border border-surface-200 rounded-lg bg-surface-0"
>
  <div class="flex flex-col gap-1 min-w-0">
    <span class="font-semibold truncate">{{ file().fileName }}</span>
    <span class="text-sm text-surface-500">
      {{ formatFileSize(file().fileSize) }} &middot; {{
      getMimeLabel(file().mimeType) }} &middot; {{ file().createdAt | date: 'd
      MMM y' }}
    </span>
  </div>
  <div class="flex gap-2 shrink-0">
    <p-button
      icon="pi pi-download"
      severity="secondary"
      size="small"
      [text]="true"
      pTooltip="Download"
      (onClick)="onDownload()"
    />
    <p-button
      icon="pi pi-trash"
      severity="danger"
      size="small"
      [text]="true"
      pTooltip="Delete"
      (onClick)="onDelete()"
    />
  </div>
</div>
