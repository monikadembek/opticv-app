<div
  class="flex items-center justify-between gap-4 p-4 border border-surface-200 rounded-lg bg-surface-0"
>
  <div class="flex flex-col gap-1 min-w-0">
    <span class="font-semibold truncate">{{ file().fileName }}</span>
    <span class="text-sm text-surface-500">
      {{ formatFileSize(file().fileSize) }} &middot; {{
      getMimeLabel(file().mimeType) }} &middot; {{ file().createdAt | date: 'd
      MMM y' }}
    </span>
    <span class="flex items-center gap-1 text-xs mt-0.5">
      @switch (file().parseStatus) {
        @case ('PENDING') {
          <i class="pi pi-spin pi-spinner text-surface-400" aria-hidden="true"></i>
          <span class="text-surface-400">Parsing&hellip;</span>
        }
        @case ('COMPLETED') {
          <i class="pi pi-check-circle text-green-500" aria-hidden="true"></i>
          <span class="text-green-500">Parsed</span>
        }
        @case ('FAILED') {
          <i class="pi pi-exclamation-triangle text-orange-500" aria-hidden="true"></i>
          <span class="text-orange-500">Parsing failed</span>
        }
      }
    </span>
  </div>
  <div class="flex gap-2 shrink-0">
    <p-button
      icon="pi pi-download"
      severity="secondary"
      size="small"
      [text]="true"
      pTooltip="Download"
      (onClick)="onDownload()"
    />
    <p-button
      icon="pi pi-trash"
      severity="danger"
      size="small"
      [text]="true"
      pTooltip="Delete"
      (onClick)="onDelete()"
    />
  </div>
</div>
