<div
  role="region"
  aria-label="CV file upload area"
  class="flex w-full flex-col items-center justify-center rounded-xl border-2 border-dashed px-10 md:px-20 py-10 text-center transition-colors"
  [class]="isDragOver() ? 'border-primary bg-primary/5' : 'border-(--text-subtle) bg-surface-50'"
>
  @if (selectedFile()) {
  <div
    class="flex w-full items-center rounded-md bg-surface-200 border border-green-500 px-4 py-2"
  >
    <i class="pi pi-file text-primary text-2xl! mr-3 inline-block"></i>
    <div class="flex-1 overflow-hidden text-left">
      <p class="truncate font-semibold text-surface-900 mr-3">
        {{ selectedFile()!.name }}
      </p>
      <p class="text-xs text-surface-500">{{ filesize() }}</p>
    </div>
    <button
      type="button"
      class="pi pi-times cursor-pointer rounded-full p-1 text-surface-500 hover:text-surface-900 ml-auto"
      aria-label="Remove file"
      title="Remove"
      (click)="removeFile()"
      [disabled]="isLoading()"
    ></button>
  </div>

  <p-button
    class="mt-6"
    label="Upload CV"
    size="small"
    [loading]="isLoading()"
    [disabled]="isLoading()"
    (onClick)="submit()"
  />
  } @else {
  <svg
    data-p-icon="cloud-upload"
    [size]="40"
    color="var(--primary-600)"
    style="width: 40px; height: 40px"
  ></svg>
  <p class="mt-4 mb-1 text-lg font-semibold text-surface-900">
    Drag & drop your CV here
  </p>
  <p class="mb-5 text-sm text-surface-500">or choose a file from your device</p>

  <label
    class="cursor-pointer rounded-md border border-primary px-4 py-2 text-sm font-semibold text-primary hover:bg-primary/5"
  >
    <span class="pi pi-folder-open mr-2" aria-hidden="true"></span>
    <input
      type="file"
      class="sr-only"
      accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      aria-label="Choose a CV file"
      (change)="onFileInputChange($event)"
    />
    Browse files
  </label>
  }
</div>
