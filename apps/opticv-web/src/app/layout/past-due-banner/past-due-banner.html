@if (visible()) {
<div
  class="past-due-banner flex items-center justify-between gap-4 bg-amber-600 px-6 py-1 text-amber-50"
  role="alert"
>
  <div class="flex items-center gap-2">
    <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
    <span class="text-sm">
      Your last payment failed. Update your payment method to keep your
      BASIC/PRO features.
    </span>
  </div>
  <div class="flex items-center gap-2">
    <p-button
      type="button"
      label="Manage billing"
      size="small"
      link
      styleClass="text-white!"
      [loading]="isRedirectingToPortal()"
      [disabled]="isRedirectingToPortal()"
      (onClick)="onManageBilling()"
      aria-label="Manage billing"
    />
    <button
      type="button"
      class="pi pi-times cursor-pointer bg-transparent border-0 text-amber-50"
      aria-label="Dismiss payment failed banner"
      title="Close"
      (click)="onDismiss()"
    ></button>
  </div>
</div>
}
