document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        if (!entry.compressed && entry.mime.indexOf('image/') === 0) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' + entry.data;
          return;
        }
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

15, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"5fa3424e-cfb3-43fb-b7bf-19aba4d2fde9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"534f490e-8fab-4007-a5b6-ecd76e0ac84a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n/* OptiCV webfonts.\n   Montserrat ships as a variable TTF (headings). Lato is loaded from Google Fonts\n   in styles.css (body). PrimeIcons (app icon font) is linked from CDN where needed. */\n\n@font-face {\n  font-family: \"Montserrat\";\n  src: url(\"1a91f9ca-4854-4106-a9b6-c453c0ee7452\") format(\"truetype\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n\n/* Design tokens */\n/* OptiCV color tokens\n   Source of truth: opticv-landing-page tailwind.config.mjs + opticv-web colors.css\n   Brand: Emerald primary, Lime accent, Slate neutrals, light-yellow highlight. */\n\n:root {\n  /* ---- Primary — Emerald ---- */\n  --primary-50: #ecfdf5;\n  --primary-100: #d1fae5;\n  --primary-200: #a7f3d0;\n  --primary-300: #6ee7b7;\n  --primary-400: #34d399;\n  --primary-500: #10b981; /* green-light / hover-bright */\n  --primary-600: #059669; /* BRAND emerald — primary actions */\n  --primary-700: #047857; /* hover / wordmark \"Opti\" */\n  --primary-800: #065f46;\n  --primary-900: #064e3b;\n  --primary-950: #022c22;\n\n  /* ---- Accent — Lime ---- */\n  --accent-50: #fefff0;\n  --accent-100: #fdffd0;\n  --accent-200: #f9ff8a;\n  --accent-300: #f2ff4d;\n  --accent-400: #e8fa1a;\n  --accent-500: #d7e506; /* BRAND lime — highlights, Pro badge border, CTA accents */\n  --accent-600: #b8c404;\n  --accent-700: #8f9903;\n  --accent-800: #6b7302;\n  --accent-900: #4a5002;\n  --accent-950: #282c01;\n\n  /* ---- Neutral — Slate (PrimeNG \"surface\" scale) ---- */\n  --neutral-50: #f8fafc;\n  --neutral-100: #f1f5f9;\n  --neutral-200: #e2e8f0;\n  --neutral-300: #cbd5e1;\n  --neutral-400: #94a3b8;\n  --neutral-500: #64748b;\n  --neutral-600: #475569;\n  --neutral-700: #334155; /* default body text */\n  --neutral-800: #1e293b;\n  --neutral-900: #0f172a;\n  --neutral-950: #020617;\n\n  --white: #ffffff;\n  --black: #404040; /* brand \"black\" is a soft charcoal, never pure #000 */\n\n  /* ---- Surface highlight ---- */\n  --light-yellow: #fdffde; /* features band, soft callout backgrounds */\n\n  /* ---- Semantic — status & severity ---- */\n  --success: #059669;\n  --success-bg: #ecfdf5;\n  --critical: #b91c1c; /* red-700 text */\n  --critical-bg: #fee2e2; /* red-100 */\n  --high: #c2410c; /* orange-700 */\n  --high-bg: #ffedd5; /* orange-100 */\n  --medium: #b45309; /* amber-700 */\n  --medium-bg: #fef3c7; /* amber-100 */\n  --low: #475569; /* slate-600 */\n  --low-bg: #f1f5f9; /* slate-100 */\n  --info: #1d4ed8; /* blue-700 — \"Required\" tags */\n  --info-bg: #dbeafe; /* blue-100 */\n  --warning: #f59e0b; /* amber-400 — processing, warnings */\n  --warning-bg: #fffbeb; /* amber-50 */\n\n  /* ---- Semantic aliases ---- */\n  --color-primary: var(--primary-600);\n  --color-accent: var(--accent-500);\n\n  --text-strong: var(--neutral-900); /* surface-900 headings */\n  --text-body: var(--neutral-700); /* default body */\n  --text-muted: var(--neutral-500); /* secondary text */\n  --text-subtle: var(--neutral-400); /* captions, meta */\n  --text-on-primary: var(--white);\n  --text-link: var(--primary-600);\n\n  --surface-page: var(--white);\n  --surface-card: var(--white);\n  --surface-sunken: var(--neutral-50); /*  --space-3: 0.75rem;  /* 12 */\n  --space-4: 1rem;     /* 16 */\n  --space-5: 1.25rem;  /* 20 */\n  --space-6: 1.5rem;   /* 24 */\n  --space-8: 2rem;     /* 32 */\n  --space-10: 2.5rem;  /* 40 */\n  --space-12: 3rem;    /* 48 */\n  --space-16: 4rem;    /* 64 */\n  --space-20: 5rem;    /* 80 */\n  --space-24: 6rem;    /* 96 */\n\n  /* ---- Radii ---- */\n  --radius-sm: 0.25rem;  /* 4 — buttons, badges, chips */\n  --radius-md: 0.5rem;   /* 8 — inputs, list rows, callouts */\n  --radius-lg: 0.75rem;  /* 12 — cards */\n  --radius-xl: 1rem;     /* 16 — large feature cards */\n  --radius-full: 9999px; /* pills, avatars, score rings, icon circles */\n\n  /* ---- Layout ---- */\n  --container-max: 1440px;   /* marketing max width */\n  --container-app: 56rem;    /* 896 — app content (max-w-4xl) */\n  --container-narrow: 42rem; /* 672 — forms (max-w-2xl) */\n\n  /* responsive horizontal padding steps */\n  --pad-x-sm: 1.25rem; /* 20 */\n  --pad-x-md: 2rem;    /* 32 */\n  --pad-x-lg: 2.5rem;  /* 40 */\n  --pad-x-xl: 5rem;    /* 80 */\n\n  /* breakpoints (reference) */\n  --bp-sm: 40rem;\n  --bp-md: 48rem;\n  --bp-lg: 64rem;\n  --bp-xl: 80rem;\n\n  /* component sizes */\n  --header-height: 5.5rem;\n  --control-h-sm: 2rem;   /* 32 */\n  --control-h-base: 2.5rem; /* 40 */\n  --control-h-lg: 3rem;   /* 48 */\n  --tap-target-min: 44px;\n}\n\n/* OptiCV elevation & effects tokens\n   Soft, low-contrast slate shadows. Cards are gently raised, never heavy. */\n\n:root {\n  /* ---- Shadows ---- */\n  --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.06); /* default card */\n  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);\n  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);\n  --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.05);\n  --shadow-header: 0 4px 24px rgba(0, 0, 0, 0.08); /* sticky header on scroll */\n  --shadow-primary: 0 12px 20px -6px rgba(5, 150, 105, 0.3); /* elevated primary button */\n\n  /* ---- Focus ring ---- */\n  --ring-focus: 0 0 0 3px rgba(5, 150, 105, 0.35);\n\n  /* ---- Transitions ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 150ms; /* @kind other */\n  --duration-base: 300ms; /* @kind other */\n  --duration-slow: 500ms; /* @kind other */\n\n  /* ---- Effects ---- */\n  --blur-header: blur(4px); /* @kind other */\n}\n\n\n/* Component classes (token-based; ship to consumers) */\n/* OptiCV component classes — token-based, shipped to consumers via styles.css.\n   Prefix: .ocv-  */\n\n/* ============ Button ============ */\n.ocv-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  white-space: nowrap;\n  border: 1px solid transparent;\n  border-radius: var(--radius-sm);\n  font-family: var(--font-body);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-wide);\n  cursor: pointer;\n  transition: background-color var(--duration-base) var(--ease-standard),\n    color var(--duration-base) var(--ease-standard),\n    border-color var(--duration-base) var(--ease-standard),\n    box-shadow var(--duration-base) var(--ease-standard);\n  text-decoration: none;\n}\n.ocv-btn:focus-visible { outline: none; box-shadow: var(--ring-focus); }\n.ocv-btn:disabled, .ocv-btn[aria-disabled=\"true\"] { cursor: not-allowed; opacity: 1; }\n\n/* sizes */\n.ocv-btn--sm { height: var(--control-h-sm); padding: 0 var(--space-4); font-size: var(--text-xs); }\n.ocv-btn--base { height: var(--control-h-base); padding: 0 var(--space-5); font-size: var(--text-sm); }\n.ocv-btn--lg { height: var(--control-h-lg); padding: 0 var(--space-6); font-size: var(--text-sm); }\n\n/* primary */\n.ocv-btn--primary { background: var(--primary-600); color: #fff; }\n.ocv-btn--primary:hover { background: var(--primary-700); }\n.ocv-btn--primary:disabled { background: var(--primary-300); }\n.ocv-btn--primary.ocv-btn--elevated { box-shadow: var(--shadow-primary); }\n\n/* secondary (soft tint) */\n.ocv-btn--secondary { background: var(--primary-50); color: var(--primary-600); }\n.ocv-btn--secondary:hover { background: var(--primary-100); color: var(--primary-700); }\n\n/* neutral (dark) */\n.ocv-btn--neutral { background: var(--neutral-700); color: #fff; }\n.ocv-btn--neutral:hover { background: var(--neutral-800); }\n\n/* outline */\n.ocv-btn--outline { background: transparent; border-color: var(--primary-600); color: var(--primary-600); }\n.ocv-btn--outline:hover { border-color: var(--primary-700); color: var(--primary-700); background: var(--primary-50); }\n\n/* white (on dark/photo) */\n.ocv-btn--white { background: #fff; color: var(--primary-700); }\n.ocv-btn--white:hover { background: var(--neutral-100); }\n\n/* accent (lime) — rare, conversion moments */\n.ocv-btn--accent { background: var(--accent-500); color: var(--neutral-900); }\n.ocv-btn--accent:hover { background: var(--accent-600); }\n\n/* link */\n.ocv-btn--link { background: transparent; border: none; padding: 0; height: auto; color: var(--primary-600); font-weight: var(--weight-regular); letter-spacing: 0; }\n.ocv-btn--link:hover { color: var(--primary-700); text-decoration: underline; }\n\n/* ============ Badge ============ */\n.ocv-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-1);\n  border-radius: var(--radius-sm);\n  padding: 2px var(--space-2);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-semibold);\n  line-height: 1.4;\n}\n.ocv-badge--neutral { background: var(--neutral-100); color: var(--neutral-600); }\n.ocv-badge--primary { background: var(--primary-600); color: #fff; }\n.ocv-badge--soft { background: var(--primary-50); color: var(--primary-700); }\n.ocv-badge--accent { background: var(--accent-100); color: var(--accent-900); }\n.ocv-badge--info { background: var(--info-bg); color: var(--info); }\n\n/* ============ Severity / status pill ============ */\n.ocv-pill {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-2);\n  border-radius: var(--radius-full);\n  padding: 2px var(--space-3);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-semibold);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-wide);\n}\n.ocv-pill--critical { background: var(--critical-bg); color: var(--critical); }\n.ocv-pill--high { background: var(--high-bg); color: var(--high); }\n.ocv-pill--medium { background: var(--medium-bg); color: var(--medium); }\n.ocv-pill--low { background: var(--low-bg); color: var(--low); }\n.ocv-pill--success { background: var(--success-bg); color: var(--success); }\n.ocv-pill--info { background: var(--info-bg); color: var(--info); }\n\n/* ============ Card ============ */\n.ocv-card {\n  background: var(--surface-card);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-card);\n  padding: var(--space-6);\n}\n.ocv-card--bordered { box-shadow: none; border: 1px solid var(--border-subtle); }\n.ocv-card--accent { border-left: 4px solid var(--primary-600); }\n.ocv-card--flush { padding: 0; }\n\n/* ============ Input ============ */\n.ocv-field { display: flex; flex-direction: column; gap: var(--space-2); }\n.ocv-label { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-body); }\n.ocv-input, .ocv-textarea {\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  color: var(--text-strong);\n  background: var(--white);\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius-md);\n  padding: 0 var(--space-3);\n  height: var(--control-h-base);\n  transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);\n  width: 100%;\n  box-sizing: border-box;\n}\n.ocv-textarea { height: auto; padding: var(--space-3); line-height: var(--leading-normal); resize: vertical; }\n.ocv-input::placeholder, .ocv-textarea::placeholder { color: var(--text-subtle); }\n.ocv-input:focus, .ocv-textarea:focus { outline: none; border-color: var(--primary-600); box-shadow: var(--ring-focus); }\n.ocv-input:disabled, .ocv-textarea:disabled { background: var(--neutral-50); color: var(--text-subtle); }\n.ocv-input--error { border-color: var(--critical); }\n.ocv-hint { font-size: var(--text-xs); color: var(--text-subtle); }\n.ocv-hint--error { color: var(--critical); }\n\n/* ============ Checkbox ============ */\n.ocv-check { display: inline-flex; align-items: flex-start; gap: var(--space-2); cursor: pointer; font-size: var(--text-sm); color: var(--text-body); }\n.ocv-check input { accent-color: var(--primary-600); width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; cursor: pointer; }\n\n/* ============ Avatar ============ */\n.ocv-avatar {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  border-radius: var(--radius-full);\n  background: var(--primary-500);\n  color: #fff;\n  font-family: var(--font-heading);\n  font-weight: var(--weight-bold);\n  overflow: hidden;\n}\n.ocv-avatar img { width: 100%; height: 100%; object-fit: cover; }\n.ocv-avatar--sm { width: 32px; height: 32px; font-size: var(--text-sm); }\n.ocv-avatar--base { width: 40px; height: 40px; font-size: var(--text-base); }\n.ocv-avatar--lg { width: 56px; height: 56px; font-size: var(--text-2xl); }\n\n/* ============ Feature card (icon circle) ============ */\n.ocv-feature { background: var(--surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-6); }\n.ocv-feature__icon {\n  width: 2.75rem; height: 2.75rem; border-radius: var(--radius-full);\n  background: var(--primary-600); color: #fff;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 1.1rem; margin-bottom: var(--space-4);\n}\n.ocv-feature__title { font-family: var(--font-heading); font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--text-strong); margin: 0 0 var(--space-2); }\n.ocv-feature__text { font-size: var(--text-sm); color: var(--text-muted); line-height: var(--leading-relaxed); margin: 0; }\n\n/* ============ Step card ============ */\n.ocv-step { background: var(--surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); border-left: 4px solid var(--primary-600); padding: var(--space-6); }\n.ocv-step__num { font-family: var(--font-heading); font-size: var(--text-4xl); font-weight: var(--weight-bold); color: var(--primary-600); line-height: 1; margin-bottom: var(--space-3); }\n.ocv-step__title { font-family: var(--font-heading); font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--text-strong); margin: 0 0 var(--space-2); }\n.ocv-step__text { font-size: var(--text-sm); color: var(--text-muted); line-height: var(--leading-relaxed); margin: 0; }\n\n/* ============ Stat tile ============ */\n.ocv-stat { text-align: center; padding: var(--space-6); }\n.ocv-stat__num { font-family: var(--font-heading); font-size: var(--text-5xl); font-weight: var(--weight-bold); color: var(--primary-600); line-height: 1; }\n.ocv-stat__cap { font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-2); line-height: var(--leading-normal); }\n\n/* ============ Accordion panel ============ */\n.ocv-accordion { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }\n.ocv-accordion__header {\n  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);\n  width: 100%; background: var(--white); border: none; cursor: pointer;\n  padding: var(--space-4) var(--space-5); font-family: var(--font-body);\n  font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--text-strong);\n  transition: background-color var(--duration-fast) var(--ease-standard); text-align: left;\n}\n.ocv-accordion__header:hover { background: var(--surface-sunken); }\n.ocv-accordion__chev { color: var(--text-subtle); transition: transform var(--duration-base) var(--ease-standard); }\n.ocv-accordion__body { padding: var(--space-5); border-top: 1px solid var(--border-subt  style=\"{{ body }}\">Mid-Level Angular Developer with 5+ years specializing in frontend solutions, particularly in Angular and TypeScript. Proven track record in delivering responsive and scalable SPAs and integrating RESTful APIs. Adept at state management with NgRx, positioned to enhance user experience and application performance in dynamic, agile teams.<\u002Fp>\n\n    <h2 style=\"{{ sectionStyle }}\">Experience<\u002Fh2>\n    <sc-for list=\"{{ jobs }}\" as=\"job\" hint-placeholder-count=\"3\">\n      <div style=\"{{ jobBlock }}\">\n        <div style=\"{{ jobRow }}\">\n          <div>\n            <span style=\"{{ jobTitle }}\">{{ job.title }}<\u002Fspan>\n            <span style=\"{{ jobDash }}\"> – {{ job.company }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"{{ jobDate }}\">{{ job.date }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"{{ jobLoc }}\">{{ job.location }}<\u002Fdiv>\n        <sc-for list=\"{{ job.bullets }}\" as=\"bullet\" hint-placeholder-count=\"3\">\n          <div style=\"{{ bulletLine }}\">\n            <span style=\"{{ bulletDot }}\">•<\u002Fspan>\n            <span style=\"{{ bulletText }}\">{{ bullet }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <h2 style=\"{{ sectionStyle }}\">Education<\u002Fh2>\n    <div style=\"{{ jobRow }}\">\n      <span style=\"{{ jobTitle }}\">Bachelor of Science<\u002Fspan>\n      <span style=\"{{ jobDate }}\">2001 – 2005<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"{{ body }}\">Akademia Bydgoska im. Kazimierza Wielkiego<\u002Fp>\n\n    <h2 style=\"{{ sectionStyle }}\">Skills<\u002Fh2>\n    <sc-if value=\"{{ usePills }}\">\n      <div style=\"{{ skillsWrap }}\">\n        <sc-for list=\"{{ skills }}\" as=\"skill\" hint-placeholder-count=\"10\">\n          <span style=\"{{ pillStyle }}\">{{ skill }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noPills }}\" hint-placeholder-val=
