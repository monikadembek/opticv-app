  <style>
    :root { --sidebar-w: 280px; --sidebar-w-collapsed: 72px; --header-h: 64px; }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font-body); color: var(--text-body); background: var(--neutral-50); -webkit-font-smoothing: antialiased; }

    /* ═══ Header ═══ */
    .app-header { height: var(--header-h); background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; padding: 0 var(--space-6); position: sticky; top: 0; z-index: 100; }
    .app-header__logo { display: flex; align-items: center; gap: var(--space-2); text-decoration: none; font-family: var(--font-heading); font-weight: var(--weight-bold); font-size: var(--text-xl); color: var(--primary-700); letter-spacing: -0.01em; }
    .app-header__logo img { width: 28px; height: auto; }
    .app-header__logo b { color: var(--primary-600); }
    .app-header__nav { display: flex; align-items: center; gap: var(--space-5); margin-left: auto; }
    .app-header__link { font-size: var(--text-sm); color: var(--text-muted); text-decoration: none; font-weight: var(--weight-semibold); transition: color var(--duration-fast); cursor: pointer; }
    .app-header__link:hover { color: var(--primary-600); }
    .app-header__link.active { color: var(--primary-600); }

    /* ═══ Layout ═══ */
    .optim-layout { display: flex; min-height: calc(100vh - var(--header-h)); }

    /* ═══ Sidebar ═══ */
    .optim-sidebar { width: var(--sidebar-w); background: var(--white); border-right: 1px solid var(--border-subtle); position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); display: flex; flex-direction: column; transition: width var(--duration-base) var(--ease-standard); overflow: hidden; flex-shrink: 0; z-index: 50; }
    .optim-sidebar.collapsed { width: var(--sidebar-w-collapsed); }
    .sidebar-scores { padding: var(--space-4); border-bottom: 1px solid var(--border-subtle); display: flex; gap: var(--space-6); justify-content: center; }
    .sidebar-group-label { font-size: 11px; font-weight: var(--weight-bold); color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.08em; padding: var(--space-3) var(--space-4) var(--space-1); white-space: nowrap; overflow: hidden; }
    .sidebar-divider { height: 1px; background: var(--border-subtle); margin: var(--space-1) var(--space-3); }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: var(--space-1) 0; }
    .nav-item { display: flex; align-items: center; gap: var(--space-3); padding: 8px 12px; margin: 2px 8px; border-radius: var(--radius-md); cursor: pointer; transition: all var(--duration-fast) var(--ease-standard); text-decoration: none; color: var(--text-body); font-size: var(--text-sm); font-weight: var(--weight-regular); white-space: nowrap; overflow: hidden; border: none; background: none; width: calc(100% - 16px); text-align: left; }
    .nav-item:hover { background: var(--neutral-50); }
    .nav-item.active { background: var(--primary-50); color: var(--primary-700); font-weight: var(--weight-semibold); }
    .nav-item.dimmed { opacity: .45; pointer-events: none; }
    .nav-item__icon { width: 32px; height: 32px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: all var(--duration-fast); }
    .nav-item.active .nav-item__icon { background: var(--primary-600); color: white; }
    .nav-item:not(.active) .nav-item__icon { background: var(--neutral-100); color: var(--text-muted); }
    .nav-item__label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .nav-item__status { flex-shrink: 0; display: flex; align-items: center; }
    .sidebar-toggle { padding: var(--space-3); border-top: 1px solid var(--border-subtle); display: flex; justify-content: center; }
    .sidebar-toggle button { display: flex; align-items: center; gap: var(--space-2); background: none; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 6px 12px; cursor: pointer; font-size: var(--text-xs); color: var(--text-muted); transition: all var(--duration-fast); white-space: nowrap; font-family: var(--font-body); }
    .sidebar-toggle button:hover { background: var(--neutral-50); color: var(--text-body); }

    /* ═══ Main Content ═══ */
    .optim-main { flex: 1; padding: var(--space-8) var(--space-8); background: var(--neutral-50); min-width: 0; }
    .optim-content { max-width: 920px; }

    /* ═══ Job Banner ═══ */
    .job-banner { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-5) var(--space-6); margin-bottom: var(--space-6); }

    /* ═══ Section Card ═══ */
    .section-card { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); margin-bottom: var(--space-6); overflow: hidden; scroll-margin-top: calc(var(--header-h) + 16px); }
    .section-card__header { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--border-subtle); }
    .section-card__icon { width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--primary-600); color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .section-card__title { font-family: var(--font-heading); font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--text-strong); flex: 1; margin: 0; }
    .section-card__body { padding: var(--space-6); }

    /* ═══ Processing ═══ */
    .processing-state { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding: var(--space-12) 0; color: var(--text-muted); }
    .processing-state i { font-size: 28px; color: var(--primary-500); }
    .processing-state p { font-size: var(--text-sm); margin: 0; }
    .skeleton { height: 12px; background: linear-gradient(90deg, var(--neutral-100) 25%, var(--neutral-200) 50%, var(--neutral-100) 75%); background-size: 200% 100%; border-radius: 6px; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ═══ Export Footer ═══ */
    .export-footer { position: fixed; bottom: 0; right: 0; background: white; border-top: 1px solid var(--border-subtle); box-shadow: 0 -4px 12px rgba(15,23,42,.06); padding: var(--space-3) var(--space-6); display: flex; align-items: center; gap: var(--space-4); z-index: 50; transition: left var(--duration-base) var(--ease-standard); }

    /* ═══ Mobile Tabs ═══ */
    .mobile-tabs { display: none; }

    @media (max-width: 768px) {
      .optim-sidebar { display: none; }
      .mobile-tabs { display: flex; position: sticky; top: var(--header-h); z-index: 50; background: white; border-bottom: 1px solid var(--border-subtle); overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 0; }
      .mobile-tabs::-webkit-scrollbar { display: none; }
      .mobile-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 14px; border: none; background: none; cursor: pointer; font-size: 10px; color: var(--text-muted); white-space: nowrap; font-family: var(--font-body); flex-shrink: 0; border-bottom: 2px solid transparent; transition: all var(--duration-fast); }
      .mobile-tab.active { color: var(--primary-600); border-bottom-color: var(--primary-600); }
      .mobile-tab i { font-size: 16px; }
      .optim-main { padding: var(--space-4); }
      .section-card__body { padding: var(--space-4); }
      .export-footer { left: 0 !important; }
    }

    @media (min-width: 769px) and (max-width: 840px) {
      .optim-sidebar { width: var(--sidebar-w-collapsed); }
      .optim-sidebar .nav-item__label,
      .optim-sidebar .nav-item__status,
      .optim-sidebar .sidebar-group-label,
      .optim-sidebar .sidebar-scores { display: none; }
      .optim-sidebar .sidebar-toggle span { display: none; }
    }
  </style>
