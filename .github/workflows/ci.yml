name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # actions/checkout only creates a local ref for the branch/PR being
      # built, not for `main` — but `nx format:check`/`nx affected` diff
      # against `main` by default. Without this, those commands fail with
      # "unknown revision" on any run that isn't building main itself
      # (e.g. a PR into `dev`). Skipped when main itself is checked out
      # (a push to main), since git refuses to fetch into the ref that's
      # currently checked out.
      - if: github.ref != 'refs/heads/main'
        run: git fetch origin main:main

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # comment out below line until connected with NX Cloud
      #- run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx nx format:check
      - run: npx nx run-many -t lint test build typecheck

  deploy:
    needs: main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build opticv-be for production
        run: |
          npx nx build opticv-be -- --configuration=production
          npx nx run opticv-be:prune

      - name: Build opticv-web for production
        run: |
          npx nx build opticv-web -- --configuration=production
          npx nx run opticv-web:prune

      # Hostinger's Git deploy watches a plain branch with the built app at
      # its root, so each app's dist/ is force-pushed to its own orphan
      # branch. Hostinger never sees Nx, the monorepo, or a build step it
      # doesn't support — its dropdown "npm install" runs against an
      # already-built, self-contained app.
      - name: Publish opticv-be to deploy-be branch
        run: |
          cd apps/opticv-be/dist
          git init -q
          git checkout -q -b deploy-be
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy opticv-be from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-be:deploy-be
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish opticv-web to deploy-web branch
        run: |
          cd dist/apps/opticv-web
          git init -q
          git checkout -q -b deploy-web
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy opticv-web from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-web:deploy-web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
