name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # actions/checkout only creates a local ref for the branch/PR being
      # built, not for `main` — but `nx format:check`/`nx affected` diff
      # against `main` by default. Without this, those commands fail with
      # "unknown revision" on any run that isn't building main itself
      # (e.g. a PR into `dev`).
      - run: git fetch origin main:main

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # comment out below line until connected with NX Cloud
      #- run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # opticv-be:serve (a dependency of opticv-be-e2e:e2e) reads
      # apps/opticv-be/config/env/development.env via ConfigModule, which
      # is gitignored and never present in CI. These are dummy, non-secret
      # values — just enough to satisfy Joi validation and let the app
      # boot; the e2e suite only calls the health-check endpoint, so
      # DATABASE_URL/DIRECT_URL etc. never need to resolve to anything real.
      - name: Write dummy backend env for e2e
        run: |
          mkdir -p apps/opticv-be/config/env
          cat > apps/opticv-be/config/env/development.env <<'EOF'
          NODE_ENV=development
          PORT=3000
          DATABASE_URL=postgresql://user:pass@localhost:5432/db
          DIRECT_URL=postgresql://user:pass@localhost:5432/db
          SUPABASE_URL=https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY=dummy
          SUPABASE_WEBHOOK_SECRET=dummy
          SUPABASE_SERVICE_ROLE_KEY=dummy
          R2_ACCOUNT_ID=dummy
          R2_ACCESS_KEY_ID=dummy
          R2_SECRET_ACCESS_KEY=dummy
          R2_BUCKET_NAME=dummy
          R2_PUBLIC_URL=https://example.com
          OPENAI_API_KEY=dummy
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_TLS=false
          FRONTEND_URL=http://localhost:4200
          STRIPE_SECRET_KEY=dummy
          STRIPE_WEBHOOK_SECRET=dummy
          STRIPE_PRICE_BASIC=dummy
          STRIPE_PRICE_PRO=dummy
          EOF

      - run: npx nx format:check
      - run: npx nx run-many -t lint test build typecheck e2e

  deploy:
    needs: main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build opticv-be for production
        run: |
          npx nx build opticv-be -- --configuration=production
          npx nx run opticv-be:prune

      - name: Build opticv-web for production
        run: |
          npx nx build opticv-web -- --configuration=production
          npx nx run opticv-web:prune

      # Hostinger's Git deploy watches a plain branch with the built app at
      # its root, so each app's dist/ is force-pushed to its own orphan
      # branch. Hostinger never sees Nx, the monorepo, or a build step it
      # doesn't support — its dropdown "npm install" runs against an
      # already-built, self-contained app.
      - name: Publish opticv-be to deploy-be branch
        run: |
          cd apps/opticv-be/dist
          git init -q
          git checkout -q -b deploy-be
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy opticv-be from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-be:deploy-be
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish opticv-web to deploy-web branch
        run: |
          cd dist/apps/opticv-web
          git init -q
          git checkout -q -b deploy-web
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy opticv-web from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-web:deploy-web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
